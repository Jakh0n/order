<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;background:#F5F5F7;color:#0B0B0F}
.wrap{width:1400px;padding:56px;box-sizing:border-box}
h1{font-size:28px;margin:0 0 4px}.sub{color:#6e6e73;margin:0 0 32px;font-size:16px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:24px}
.card{background:#fff;border-radius:28px;padding:40px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.dark{background:#0B0B0F}.red{background:linear-gradient(135deg,#FF5A4E,#D91E36)}
.lbl{font-size:13px;color:#86868b;align-self:flex-start}.dark .lbl{color:#9a9aa0}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:24px}
.sizes{display:flex;align-items:flex-end;gap:28px}.sizes div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#86868b}
.sw{display:flex;gap:12px}.sw div{width:96px;height:96px;border-radius:20px;display:flex;align-items:flex-end;padding:10px;box-sizing:border-box;font-size:12px}
.phone{width:256px;height:180px;border-radius:24px;background:linear-gradient(#6b8cff,#b18cff);display:grid;grid-template-columns:repeat(3,56px);gap:18px;padding:22px;box-sizing:border-box}
.phone img,.phone span{width:56px;height:56px;border-radius:13px}.phone span{background:rgba(255,255,255,.35)}
</style></head><body><div class="wrap">
<h1>Tezda — logo</h1><p class="sub">— • &nbsp;Morze alifbosida "TE". Nuqta bir zumda yetib keladi, ortida iz qoladi.</p>
<div class="grid">
 <div class="card" style="height:320px"><span class="lbl">Asosiy</span><img src="tezda-lockup.svg" width="620"></div>
 <div class="card" style="height:320px"><span class="lbl">Ilova ikonkasi</span><img src="tezda-app-icon.svg" width="200"></div>
</div>
<div class="grid" style="margin-top:24px">
 <div class="card dark" style="height:260px"><span class="lbl">Qora fonda</span><img src="tezda-lockup-dark.svg" width="560"></div>
 <div class="card" style="height:260px"><span class="lbl">Telefonda</span><div class="phone"><span></span><img src="tezda-app-icon.svg"><span></span><span></span><span></span><span></span></div></div>
</div>
<div class="row">
 <div class="card"><span class="lbl">Belgi</span><img src="tezda-symbol.svg" width="150"></div>
 <div class="card"><span class="lbl">Bir rang</span><img src="tezda-symbol-black.svg" width="150"></div>
 <div class="card red"><span class="lbl" style="color:#ffd9d9">Brend fonida</span><img src="tezda-symbol-white.svg" width="150"></div>
 <div class="card"><span class="lbl">Kichik o'lchamlar</span><div class="sizes">
  <div><img src="tezda-app-icon.svg" width="64">64</div><div><img src="tezda-app-icon.svg" width="32">32</div><div><img src="tezda-app-icon.svg" width="16">16</div></div></div>
</div>
<div class="card" style="margin-top:24px;align-items:flex-start"><span class="lbl">Ranglar</span><div class="sw">
 <div style="background:#F5333F;color:#fff">Tezda qizil<br>#F5333F</div>
 <div style="background:linear-gradient(135deg,#FF5A4E,#D91E36);color:#fff">Ikonka<br>gradient</div>
 <div style="background:#0B0B0F;color:#fff">Siyoh<br>#0B0B0F</div>
 <div style="background:#F5F5F7;border:1px solid #ddd">Fon<br>#F5F5F7</div></div></div>
</div></body></html>
